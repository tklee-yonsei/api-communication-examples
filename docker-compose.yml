# 마이크로서비스 API 통신 테스트 환경
# 사용법: docker-compose up -d

services:
  # ===========================================
  # FastAPI REST API 서버 (외부에서 curl 테스트 가능)
  # 자동 문서: http://localhost:8080/docs
  # ===========================================

  rest-api:
    build:
      context: .
      dockerfile: rest_api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - app-network

  # ===========================================
  # REST UI + 부하/정확도 테스트 도구
  # ===========================================
  # 브라우저에서 http://localhost:3000 에 접속해
  # 버튼(1/100/10000 요청)으로 FastAPI 서버에 대량 요청을 보낼 수 있습니다.
  # 기본 대상은 docker 네트워크의 rest-api:8080 이며, UI에서 base URL을 바꿀 수 있습니다.

  communication-ui:
    build:
      context: .
      dockerfile: communication_ui/Dockerfile
    ports:
      - "3001:3000"  # Cursor IDE 포트 충돌 방지
    environment:
      - REST_API_BASE_URL=http://rest-api:8080
    volumes:
      # 개발 중 실시간 코드 반영을 위한 볼륨 마운트
      - ./communication_ui:/app/communication_ui
      - ./communication:/app/communication
      - ./rest_api:/app/rest_api
    depends_on:
      rest-api:
        condition: service_started
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
